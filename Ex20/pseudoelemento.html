<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<style>
    /*
    SELETORES PERSONALIZADOS:
    # = id
    . = class
    : = Pseudoclass
    :: = Pseudoelement
    > = children
    */
    body {
        font-family: Arial, Helvetica, sans-serif;

    }
    a {
        color: rgb(111, 124, 235);
        text-decoration: none;
        font-weight: bold;

    }
    a:visited {
        color: rgb(0, 0, 0);
    }
    a:hover {
        color: rgb(44, 15, 170);
        text-decoration: underline;
    }
    .especial::after{ 
        content: 'Página Youtube';
        background-color: red;
    }
    a:active {
        color: aqua;
    }
    a::after {
        content:'[Link]';
        text-decoration: none;
        font-weight: normal;
        color: aqua;
    }
</style>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara/html-css/tree/master/desafios/modulo-02">Repositório do GitHub</a></li>
        <li class="especial"><a href="https://www.youtube.com/">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-2-de-5-40-horas/aulas/modulo-2-2/modulos/capitulo-14-aula-10-alinhamento-de-textos-com-css/">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
