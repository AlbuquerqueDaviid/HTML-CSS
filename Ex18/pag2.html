<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    
    <style>
        @font-face {
            font-family: 'Miracle';
            src: url('fonts/Miracle\ History.ttf') format(truetype),;
            font-weight: normal;
            font-size: normal;
        }
          /*
          Tipos de format()
          opentype(otf)
          truetype(ttf)
          embedded-opentype
          truetype-aat (Apple Advanced Typography)
          svg
          
          */

          body{
            font-family: Arial, Helvetica, sans-serif;
          }
          h1{
            font-family: 'Miracle', Times,  serif;
            font-size: 3em;
          }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Corporis quis praesentium vitae facilis maxime eligendi quidem. Veniam sint dignissimos ex corrupti qui culpa. Itaque adipisci deleniti iusto at eveniet consequuntur!
    </p>
</body>
</html>
