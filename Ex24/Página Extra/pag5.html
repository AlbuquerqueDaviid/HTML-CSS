<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScipt</title>
    <style>
        div{
            width: 50px;
            height: 100px;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicou()">Clique em mim</a>
    <div id="saida"></div>
    
    <script>
        function clicou() {
            s = window.document.getElementById("saida");
            s.innerHTML += '<p>Você clicou!</p>'
        }
    </script>
</body>
</html>
