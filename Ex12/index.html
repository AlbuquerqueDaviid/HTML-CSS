<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>

    <video src="midia/video.mp4" width="500" controls loop></video>

    <video width="500" poster="midia/" controls loop>

        <source src="midia/video.mp4" type="video/mp4">
        <source src="midia/video.mp4" type="video/webm">
        <source src="midia/video.mp4" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com reprodutor de vídeos.</p>

    </video>
    <h1>Videos Inseridos Compartilhados</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=uIjkZJlUwuGBg7rZ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe title="vimeo-player" src="https://player.vimeo.com/video/1166010063?h=b2b89f579c" width="560" height="315" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
</body>
</html>
