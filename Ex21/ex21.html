<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            
            background-color: gray;
            width: 300px;
            height: 300px;
            border: 10px solid darkgray;

            padding: 10px 10px 10px 10px;
            
            margin: 10px auto 20px auto ;
            

            outline: 5px dashed red;
        }
        p{
            margin: 20px auto;
            padding: 10px;

        }
        a {
            display: block;
            border: 8px solid red;
            border-radius: 20px;

            padding: 5px;

            margin: 20px 10px;
        }
        
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragráfos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixa inline-level</a>. vamos ver como tudo isso funciona.</p>
</body>
</html>
